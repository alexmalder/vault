---
services:
  vault:
    image: vault:1.3.1
    command:
    - vault 
    - server 
    - -config=/vault/config/vault-config.json
    cap_add:
      - IPC_LOCK
    env_file:
      - ./.env
    ports:
      - ${VAULT_PORT}:8200
    volumes:
      - C:\Users\alexmalder\devops\vault\data\data:/vault/file
      - C:\Users\alexmalder\devops\vault\data\logs:/vault/logs
      - C:\Users\alexmalder\devops\vault\vault-config.json:/vault/config/vault-config.json
