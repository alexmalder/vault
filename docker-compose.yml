---
services:
  vault:
    image: vault:1.3.1
    command:
    - vault 
    - server 
    - -config=/vault/config/vault-config.json
    cap_add:
      - IPC_LOCK
    ports:
      - 8200:8200
    volumes:
      - ./data/data:/vault/file
      - ./data/logs:/vault/logs
      - ./vault-config.json:/vault/config/vault-config.json:ro
